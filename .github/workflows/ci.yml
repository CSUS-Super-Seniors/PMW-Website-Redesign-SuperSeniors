name: CI

on:
  # Every PR, including stacked PRs that target another feature branch.
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, format, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-24.04
    container:
      # Match the Playwright version pinned in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Run Playwright smoke test
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  rls:
    name: RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Starts only Postgres and applies every migration.
      - run: npx supabase db start
      - run: npm run db:test
      # Runs seed.sql twice against the same database (changes are rolled back).
      - run: npm run test:seed
        env:
          SEED_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
