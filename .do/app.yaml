name: pmw-website
region: sfo

services:
  - name: api
    environment_slug: node-js
    github:
      repo: CSUS-Super-Seniors/PMW-Website-Redesign-SuperSeniors
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build -w server
    run_command: npm run start -w server
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    routes:
      - path: /api
        preserve_path_prefix: true

    health_check:
      http_path: /api/health

    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: '8080'
        scope: RUN_TIME
      - key: CLIENT_ORIGINS
        value: ${APP_URL}
        scope: RUN_TIME
      - key: SUPABASE_URL
        type: SECRET
        scope: RUN_TIME
      - key: SUPABASE_SERVICE_ROLE_KEY
        type: SECRET
        scope: RUN_TIME

static_sites:
  - name: web
    environment_slug: node-js
    github:
      repo: CSUS-Super-Seniors/PMW-Website-Redesign-SuperSeniors
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build -w client
    output_dir: client/dist
    catchall_document: index.html

    routes:
      - path: /
